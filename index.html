<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luzio’s 0-0-2 Photo Bingo</title>
<style>
:root{--bg:#f4fbf4;--card:#fff;--ink:#14301c;--green:#2e9b4f;--lime:#c8f169;--line:#cfe8d4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:16px 12px 28px;padding-top:calc(env(safe-area-inset-top,0px)+16px);padding-bottom:calc(env(safe-area-inset-bottom,0px)+28px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1d14;--card:#18291e;--ink:#eaf6ec;--line:#2c4733}}
:root[data-theme="dark"]{--bg:#0f1d14;--card:#18291e;--ink:#eaf6ec;--line:#2c4733}
h1{margin:4px 0 0;font-size:28px}.sub{margin:4px 0 14px;font-size:14px;opacity:.8}
.badge{display:inline-block;background:var(--lime);color:#14301c;font-weight:700;font-size:13px;padding:4px 12px;border-radius:99px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:460px;margin:0 auto}
.cell{aspect-ratio:1;background:var(--card) center/cover no-repeat;border:2px dashed var(--line);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3px;font-size:10.5px;line-height:1.15;font-weight:600;cursor:pointer;user-select:none;position:relative;overflow:hidden;color:var(--ink);font-family:inherit}
.cell .ic{font-size:15px;opacity:.7;margin-bottom:2px}.cell.done{border:2px solid var(--green)}.cell.done .ic,.cell.done .t{display:none}
.cell .cap{display:none;position:absolute;left:0;right:0;bottom:0;background:rgba(20,48,28,.72);color:#fff;font-size:8.5px;padding:2px;font-weight:600}.cell.done .cap{display:block}
.cell .x{display:none;position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:20px;padding:0}.cell.done .x{display:block}
.count{margin:14px 0 6px;font-weight:700}.win{display:none;margin:10px auto;max-width:460px;background:var(--lime);color:#14301c;border-radius:14px;padding:12px;font-weight:800;font-size:20px}.win.show{display:block}
.btns{display:flex;gap:8px;justify-content:center;margin-top:10px}button.b{border:2px solid var(--green);background:transparent;color:var(--ink);border-radius:99px;padding:9px 18px;font-weight:700;font-size:14px;font-family:inherit}
.drive{display:inline-block;margin-top:14px;background:var(--green);color:#fff;text-decoration:none;font-weight:700;font-size:15px;padding:11px 22px;border-radius:99px}.rule{font-size:12.5px;opacity:.8;max-width:420px;margin:12px auto 0}
@media print{.btns,.count{display:none}body{background:#fff;color:#000}}
</style>
</head>
<body>
<div class="badge">Sat · Dec 12 · Pickl @ Pilit</div>
<h1>Luzio’s 0-0-2 Bingo</h1>
<p class="sub">Pickleball Photo Blackout</p>
<div class="grid" id="grid"></div>
<div class="count" id="count">0 / 25 photos</div>
<div class="win" id="win">🏆 BLACKOUT! You win! 🏆</div>
<div class="btns"><button class="b" id="clear">Clear photos</button></div>
<a class="drive" href="https://drive.google.com/drive/folders/1SeypJl2jTUt5PV34KQGjE5oScD6zPgWp" target="_blank" rel="noopener">📁 Upload your photos to Drive</a>
<p class="rule">Tap a square and snap a photo of it. Fill all 25 squares to win. Tap a photo to retake it.</p>
<input type="file" id="file" accept="image/*" capture="environment" hidden>
<script>
const items=["Luzio holding a paddle","Someone mid-swing","Ball in the air","Green & white outfit","Birthday cake","Candle moment","Souvenirs","Family group pic","High five","Funny face","Paddle pose","Luzio’s biggest smile","The court","Party food","Luzio with mama or dada","Hug for Luzio","Grandparent with Luzio","Winning moment","Cheers with drinks","Birthday banner","Close-up of the ball","Someone laughing","Gift table","Kids playing","Sneakers","Sunglasses pose"];
const grid=document.getElementById('grid'),count=document.getElementById('count'),win=document.getElementById('win'),file=document.getElementById('file');let target=null;
function update(){const n=grid.querySelectorAll('.done').length;count.textContent=n+' / 25 photos';win.classList.toggle('show',n===25)}
function setPhoto(c,url){c.style.backgroundImage='url("'+url+'")';c.classList.add('done');update()}
function clearCell(c){c.style.backgroundImage='';c.classList.remove('done');update()}
function build(){const pick=items.slice(0,24);pick.splice(12,0,"Selfie with Luzio 🎉");grid.innerHTML='';pick.forEach(t=>{const c=document.createElement('div');c.className='cell';c.setAttribute('role','button');c.tabIndex=0;c.innerHTML='<span class="ic">📷</span><span class="t"></span><span class="cap"></span><button class="x" type="button" aria-label="Remove photo">×</button>';c.querySelector('.t').textContent=t;c.querySelector('.cap').textContent=t;c.onclick=()=>{target=c;file.value='';file.click()};c.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')e.preventTarget};c.querySelector('.x').onclick=e=>{e.stopPropagation();clearCell(c)};grid.appendChild(c)});update()}
file.onchange=()=>{const f=file.files&&file.files[0];if(!f||!target)return;const c=target,u=URL.createObjectURL(f),img=new Image();img.onload=()=>{const s=Math.min(1,360/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=img.width*s;cv.height=img.height*s;cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);setPhoto(c,cv.toDataURL('image/jpeg',.75));URL.revokeObjectURL(u)};img.onerror=()=>URL.revokeObjectURL(u);img.src=u};
document.getElementById('clear').onclick=()=>{grid.querySelectorAll('.cell').forEach(clearCell)};build();
</script>
</body>
</html>
